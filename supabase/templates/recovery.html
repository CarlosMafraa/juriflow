<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f4f6fa;
      font-family: Arial, Helvetica, sans-serif;
      color: #1e293b;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 8px;
        padding: 32px;
      "
    >
      <tr>
        <td>
          <h1 style="margin: 0 0 16px; font-size: 20px; color: #1e3a8a">Redefinição de senha</h1>
          <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.5">
            Recebemos um pedido para redefinir a senha da sua conta no JuriFlow. Clique no botão
            abaixo para escolher uma nova senha.
          </p>
          <p style="margin: 24px 0">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                background: #1e3a8a;
                color: #ffffff;
                text-decoration: none;
                padding: 12px 20px;
                border-radius: 6px;
                font-weight: bold;
              "
            >
              Redefinir senha
            </a>
          </p>
          <p style="margin: 0 0 8px; font-size: 13px; color: #64748b">
            Se você não pediu a redefinição, ignore este e-mail — sua senha continua a mesma.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
