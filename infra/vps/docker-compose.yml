name: juriflow

services:
  waha:
    # NUNCA `latest`: versão fixa + digest, para `docker compose pull` trazer
    # sempre exatamente esta imagem. Atualizar = trocar tag e digest aqui, num
    # commit revisado (não é variável de ambiente). Imagem `gows-*`: só o motor
    # GOWS, sem Chrome. Precisa ser >= 2026.6.1 (sessões ilimitadas no Core,
    # uma por espaço). 2026.9.1 = última estável em 2026-09-22.
    image: devlikeapro/waha:gows-2026.9.1@sha256:d2056b8dec41b218b54f431b8b4eb7d148346d530bb3658295ecb882944e9a18
    restart: unless-stopped
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      # GOWS fala direto com o protocolo do WhatsApp, sem Chrome dentro do
      # container: o WEBJS (padrão) estoura o tempo de carga do WhatsApp Web
      # em máquina pequena. Disponível no WAHA Core (gratuito).
      WHATSAPP_DEFAULT_ENGINE: GOWS
    volumes:
      - waha_sessions:/app/.sessions
    # Nunca publicar a porta 3000 na internet: só o scraper-worker (rede
    # interna deste compose) fala HTTP com o WAHA. Sessão por espaço,
    # nome namespaced (`space_<id>`) — RN seção 22 / F12: o QR code de cada
    # espaço chega ao ADMIN pela própria tela do app (/configuracoes/whatsapp),
    # via whatsapp_sessions no Supabase; o WAHA em si nunca é acessado direto
    # pelo navegador (docs/PLANO-FASE-1.md seção 10). Túnel SSH continua
    # disponível só para depuração administrativa, não é mais o fluxo normal.

  scraper-worker:
    build:
      context: ../..
      dockerfile: services/scraper-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - waha
    # É o único componente que conhece a WAHA_API_KEY: fala com o WAHA na
    # rede interna do compose, atende os pedidos de conexão/QR/status gravados
    # em whatsapp_sessions e envia mensagens usando a sessão do espaço do
    # processo. Porta 3000 (HTTP de "consultar agora") continua sem
    # publicação externa — acessar via túnel SSH se precisar depurar.

volumes:
  waha_sessions:
